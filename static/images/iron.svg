<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Bundle of TMT iron bars">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf3e6"/><stop offset="1" stop-color="#fbf8f3"/></linearGradient>
    <linearGradient id="rod" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8c97a3"/><stop offset=".35" stop-color="#5b6672"/><stop offset=".7" stop-color="#3a444f"/><stop offset="1" stop-color="#2a323b"/></linearGradient>
    <pattern id="ribs" width="14" height="20" patternUnits="userSpaceOnUse" patternTransform="skewX(-28)"><rect width="3" height="20" fill="#1f262e" opacity=".55"/></pattern>
    <g id="r"><rect x="0" y="0" width="300" height="17" rx="8.5" fill="url(#rod)"/><rect x="0" y="0" width="300" height="17" rx="8.5" fill="url(#ribs)"/><rect x="6" y="2.5" width="288" height="3" rx="1.5" fill="#fff" opacity=".35"/></g>
  </defs>
  <rect width="400" height="260" rx="18" fill="url(#bg)"/>
  <ellipse cx="200" cy="228" rx="165" ry="11" fill="#0e2a47" opacity=".14"/>
  <g transform="translate(50 74)">
    <use href="#r" x="0" y="0"/><use href="#r" x="0" y="19"/><use href="#r" x="0" y="38"/><use href="#r" x="0" y="57"/>
    <use href="#r" x="0" y="76"/><use href="#r" x="0" y="95"/><use href="#r" x="0" y="114"/>
    <use href="#r" x="25" y="-19"/><use href="#r" x="25" y="-38"/>
  </g>
  <g fill="#e9871a">
    <rect x="108" y="40" width="16" height="152" rx="3"/>
    <rect x="246" y="40" width="16" height="152" rx="3"/>
  </g>
  <g fill="#fff" opacity=".35"><rect x="111" y="42" width="3" height="148" rx="1.5"/><rect x="249" y="42" width="3" height="148" rx="1.5"/></g>
  <rect x="150" y="104" width="100" height="44" rx="6" fill="#fff" stroke="#e2e8f0"/>
  <text x="200" y="124" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-weight="700" font-size="14" fill="#0e2a47">TMT BARS</text>
  <text x="200" y="140" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="10" fill="#5d6c7b">8 – 25 mm</text>
</svg>
